    ObservationOut:
      type: object
      properties:
        observation_id: { type: string, format: uuid, description: Client-generated stable ID preserved during sync. }
        astronaut_id: { type: string, format: uuid }
        mission_id: { type: string, format: uuid }
        measurement_code: { type: string }
        catalogue_version: { type: string }
        value: {}
        unit: { type: [string, 'null'] }
